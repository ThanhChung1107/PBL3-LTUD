<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Messenger</title>
  <link rel="stylesheet" th:href="@{/css/chat_style.css}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="messenger-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="add-group">
        <h2>💬 Chat Sản Phẩm</h2>
        <div class="icon-add-container">
          <div class="icon-add"><i class='bx bx-plus'></i></div>
          <div class="add-menu">
            <div class="add-option" onclick="showCreateGroupModal()">
              <i class='bx bx-plus-circle'></i>
              <span>Tạo nhóm mới</span>
            </div>
            <div class="add-option" onclick="showJoinGroupModal()">
              <i class='bx bx-group'></i>
              <span>Tham gia nhóm</span>
            </div>
          </div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Tìm kiếm cuộc trò chuyện...">
      </div>
    </div>
    <!-- chat-room.html -->
    <div class="chat-list">
      <a th:each="group : ${groups}"
         th:href="@{/user/chat/group/{id}(id=${group.id})}"
         class="chat-item-link"
         th:classappend="${group.id == selectedGroupId} ? 'active-link' : ''">

        <div class="chat-item"
             th:classappend="${group.id == selectedGroupId} ? 'active-chat' : ''"
             th:data-chat="${group.id}">

          <div class="chat-avatar">
            <img th:if="${group.groupavt != null}"
                 th:src="@{/img/{imgfile}(imgfile = ${group.groupavt})}"
                 alt="Group avatar">
            <span th:unless="${group.groupavt != null}">👥</span>
          </div>

          <div class="chat-info">
            <div class="chat-name" th:text="${group.groupname}">Tên nhóm</div>
            <div class="chat-last-msg"
                 th:text="${lastMessages[group.id] != null ? lastMessages[group.id].content : 'Chưa có tin nhắn'}">
            </div>
          </div>

          <div class="chat-time"
               th:text="${lastMessages[group.id] != null ? #temporals.format(lastMessages[group.id].createdAt, 'HH:mm') : ''}">
          </div>
        </div>
      </a>
    </div>

    <div class="sidebar-footer">
      <a th:href="@{/user/home}" class="btn-home">
        <i class='bx bx-home'></i>
        <span>Trang Chủ</span>
      </a>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="chat-area" th:if="${selectedGroup != null}">
    <div class="chat-header" >
      <div class="chat-header-info">
        <div class="chat-header-avatar">
          <img th:if="${selectedGroup != null and selectedGroup.groupavt != null}"
               th:src="@{/img/{imgfile}(imgfile = ${selectedGroup.groupavt})}"
               alt="Group avatar">
          <span th:if="${selectedGroup == null or selectedGroup.groupavt == null}">👥</span>
        </div>
        <div class="header-name-status">
            <div class="chat-header-name" th:text="${selectedGroup.groupname  }"></div>
            <div class="chat-header-status" th:text="${memberCount} + ' thành viên'"> </div>
        </div>
      </div>
      <div class="chat-actions">
        <button class="more-option"><i class='bx  bx-dots-horizontal-rounded'></i></button>
        <div class="group-options" id="groupOptions">
          <div class="option-item">
            <i class='bx bx-info-circle'></i>
            <span onclick="showGroupDetail()">Chi tiết nhóm</span>
          </div>
          <div class="option-item">
            <i class='bx bx-user-plus'></i>
            <span>Mời thành viên</span>
          </div>

          <div class="option-item">
            <i class='bx bx-exit'></i>
            <span>Rời nhóm</span>
          </div>
        </div>
      </div>
    </div>

<!--    <div class="messages-container" id="messages">-->
<!--      <div class="message received">-->
<!--        <div class="message-avatar">M</div>-->
<!--        <div class="message-bubble">Chào mọi người! Có ai biết shop nào bán iPhone 15 Pro uy tín không?</div>-->
<!--      </div>-->

<!--      </div>-->

<!--        <div class="message-avatar">M</div>-->

<!--          <div class="product-card">-->

<!--              </div>-->

<!--            </div>-->
<!--          </div>-->
<!--        </div>-->
<!--      </div>-->

<!--      <div class="message received">-->
<!--        <div class="message-avatar">L</div>-->
<!--        <div class="message-bubble">Wow giá tốt đấy! Shop này ở đâu vậy?</div>-->
<!--      </div>-->

<!--      <div class="message sent">-->
<!--        <div class="message-bubble">Shop ở Hà Nội, ship toàn quốc. Bảo hành 12 tháng chính hãng</div>-->

<!--      </div>-->

    <div class="messages-container" id="messages">
      <th:block th:each="msg : ${messages}">
        <div th:class="'message ' + (${msg.sender.username} == ${session.account.username} ? 'sent' : 'received')">

          <!-- Nếu là của tôi thì bubble trước avatar -->
          <th:block th:if="${msg.sender.username} == ${session.account.username}">
            <div class="message-bubble" th:text="${msg.content}"></div>
            <div class="message-avatar">
              <img th:src="@{'/img/' + ${msg.sender.imageurl}}" alt="Avatar">
            </div>
          </th:block>

          <!-- Nếu là người khác thì avatar trước bubble -->
          <th:block th:unless="${msg.sender.username} == ${session.account.username}">
            <div class="message-avatar">
              <img th:src="@{'/img/' + ${msg.sender.imageurl}}" alt="Avatar">
            </div>
            <div class="message-bubble" th:text="${msg.content}"></div>
          </th:block>

        </div>
      </th:block>
    </div>
    <script>
      window.onload = function() {
          const messagesContainer = document.getElementById("messages");
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    </script>

    <input type="hidden" id="username" th:value="${session.account.username}">
    <input type="hidden" id="useravatar" th:value="${session.account.imageurl}">
    <input type="hidden" id="userId" th:value="${session.account.id}">
    <input type="hidden" id="currentGroupId" th:value="${selectedGroup?.id}">
    <div class="input-area">
      <div class="input-actions">
        <button class="input-btn attachment-btn" title="Đính kèm file">📎</button>
        <!-- <button class="input-btn product-btn-input" title="Chia sẻ sản phẩm" onclick="openProductModal()">🛍️</button> -->
      </div>
      <textarea class="message-input" placeholder="Nhập tin nhắn..." rows="1" id="messageInput"></textarea>
      <button class="input-btn send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>


    <div class="empty-chat" th:unless="${selectedGroup != null}">
        <div class="empty-icon">💬</div>
        <p>Chưa có nhóm nào được chọn</p>
        <p>Vui lòng chọn nhóm từ danh sách hoặc tạo nhóm mới</p>
        <div class="action-buttons">
            <button class="action-button" onclick="showCreateGroupModal()">
                <i class='bx bx-plus'></i> Tạo nhóm mới
            </button>
            <button class="action-button" onclick="showJoinGroupModal()">
                <i class='bx bx-group'></i> Tham gia nhóm
            </button>
        </div>
    </div>
</div>

<!-- Product Share Modal -->

<form action="/user/create-group" method="post" enctype="multipart/form-data">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <div class="group-modal" id="createGroupModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tạo nhóm mới</h3>
        <span class="close-btn" onclick="closeModal('createGroupModal')">&times;</span>
      </div>
      <div class="modal-body">
        <div class="group-avatar-upload">
          <label for="groupAvatar">
            <div class="avatar-preview">
              <i class='bx bx-camera'></i>
              <span>Thêm ảnh nhóm</span>
            </div>
          </label>
          <input type="file" name="groupavatar" id="groupAvatar" accept="image/*" hidden>
        </div>
        <div class="form-group">
          <label>Tên nhóm</label>
          <input type="text" name="groupname" placeholder="Nhập tên nhóm" class="group-name-input" required>
        </div>
        <button class="submit-btn" type="submit">Tạo nhóm</button>
      </div>
    </div>
  </div>
</form>


<!-- Modal Tham gia nhóm -->
<div class="group-modal" id="joinGroupModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Tham gia nhóm</h3>
      <span class="close-btn" onclick="closeModal('joinGroupModal')">&times;</span>
    </div>
    <div class="modal-body">
      <form id="joinGroupForm" th:action="@{/user/join}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
          <label>Mã nhóm</label>
          <input type="text" name="groupCode"
                 placeholder="Nhập mã nhóm (6 ký tự)"
                 class="group-code-input"
                 pattern="[A-Za-z0-9]{6}"
                 title="Mã nhóm phải gồm 6 ký tự chữ hoặc số"
                 required>
          <!-- Hiển thị lỗi -->
          <div id="groupCodeError" class="error-message"></div>
        </div>

        <!-- Hiển thị thông báo lỗi chung -->
        <div id="joinGroupError" class="error-message mb-3"></div>

        <button type="submit" class="submit-btn">Tham gia nhóm</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal Chi tiết nhóm -->
<div class="group-modal" id="groupDetailModal">
  <div class="modal-content" th:if="selectedGroup != null">
    <div class="modal-header">
      <h3>Chi tiết nhóm</h3>
      <span class="close-btn" onclick="closeModal('groupDetailModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div class="group-avatar">
          <img th:if="${selectedGroup != null and selectedGroup.groupavt != null}"
               th:src="@{/img/{imgfile}(imgfile = ${selectedGroup.groupavt})}"
               alt="Group avatar">
          <span th:if="${selectedGroup == null or selectedGroup.groupavt == null}">👥</span>
        <button class="edit-avatar-btn" onclick="changeGroupAvatar()">
          <i class='bx bx-camera'></i>
        </button>
      </div>

      <div class="group-info">
        <div class="info-item">
          <i class='bx bx-rename'></i>
          <div>
            <span class="info-label">Tên nhóm</span>
            <span class="info-value" id="detailGroupName" th:text="${selectedGroup?.groupname}"></span>
          </div>
          <button class="edit-btn" onclick="editGroupName()">
            <i class='bx bx-edit'></i>
          </button>
        </div>

        <div class="info-item">
          <i class='bx bx-group'></i>
          <div>
            <span class="info-label">Thành viên</span>
            <span class="info-value" id="detailMemberCount" th:text="${memberCount}  + ' thành viên'"></span>
          </div>
          <button class="view-member-btn" onclick="viewMembers()">
            <i class='bx bx-show'></i>
          </button>
        </div>

        <div class="info-item">
          <i class='bx bx-key'></i>
          <div>
            <span class="info-label">Mã nhóm</span>
            <span class="info-value" id="detailGroupCode" th:text="${selectedGroup?.groupcode}"></span>
          </div>
          <button class="copy-btn" onclick="copyGroupCode()">
            <i class='bx bx-copy'></i>
          </button>
        </div>
      </div>

      <div class="group-actions">
        <button class="action-btn share-btn" onclick="shareGroup()">
          <i class='bx bx-share-alt'></i> Chia sẻ nhóm
        </button>
        <button class="action-btn leave-btn" onclick="leaveGroup()">
          <i class='bx bx-exit'></i> Rời nhóm
        </button>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/chatroom.js}"></script>


</body>
</html>
