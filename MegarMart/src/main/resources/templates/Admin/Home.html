<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin/head_side.css}">
  <link rel="stylesheet" th:href="@{/css/admin/form_view.css}">
  <script th:src="@{/js/admin.js}"></script>
</head>
<body>
<div class="header">
  <div class="left-head">
    <h3>Quản lí tài khoản</h3>
  </div>
  <div class="right-head">
    <h3>Xin chào,admin</h3>
  </div>
</div>

<div th:replace="fragments/sidebar_admin.html :: sidebaradmin"></div>

<div class="content">
  <div class="box">
    <div class="box-header with-border">
      <h3 class="box-title">Tài khoản</h3>
    </div>
    <!-- /.box-header -->
    <div class="box-body">
      <table class="table table-bordered">
        <tbody><tr>
          <th style="width: 10px">ID</th>
          <th>Họ và tên</th>
          <th>Email</th>
          <th>SĐT</th>
          <th>Địa chỉ</th>
          <th>Role</th>
          <th>Ngày tạo</th>
          <th>Ngày cập nhật</th>
          <th>Chức năng</th>
        </tr>
        <tr th:each="acc : ${listacc}"  th:if="${acc.name != 'ADMIN'}">
          <td th:text="${acc.id}"></td>
          <td th:text="${acc.name}"></td>
          <td th:text="${acc.email}"></td>
          <td th:text="${acc.phone}"></td>
          <td th:text="${acc.address}"></td>
          <td th:text="${acc.role.roleName}"></td>
          <td th:text="${#temporals.format(acc.createdAt, 'dd/MM/yyyy')}"></td>
          <td th:text="${#temporals.format(acc.updatedAt, 'dd/MM/yyyy')}"></td>
          <td>
            <button class="btn btn-edit"><a href="order.html" style="color:#fff">Xem</a></button>
            <button class="btn btn-delete">Xóa</button>
          </td>
        </tr>
        </tbody></table>
    </div>
    <!-- /.box-body -->
    <div class="box-footer clearfix">
      <ul class="pagination">
        <li><a href="#">«</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">»</a></li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
