<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin/head_side.css}">
  <link rel="stylesheet" th:href="@{/css/admin/form_view.css}">
  <script th:src="@{/js/admin.js}"></script>
</head>
<body>
<div class="header">
  <div class="left-head">
    <h3>Quản lí cửa hàng</h3>
  </div>
  <div class="right-head">
    <h3>Xin chào,admin</h3>
  </div>
</div>

<div th:replace="fragments/sidebar_admin.html :: sidebaradmin"></div>

<div class="content">
  <div class="box">
    <div class="box-header with-border">
      <h3 class="box-title">Shop</h3>
    </div>
    <!-- /.box-header -->
    <div class="box-body">
      <table class="table table-bordered">
        <tbody><tr>
          <th style="width: 10px">ID</th>
          <th>Image</th>
          <th>Tên cửa hàng</th>
          <th>Tên chủ sở hữu</th>
          <th>SĐT</th>
          <th>Địa chỉ</th>
          <th>Ngày tạo</th>
          <th>Ngày cập nhật</th>
          <th>Chức năng</th>
        </tr>
        <tr th:each="shop : ${listshop}">
          <td th:text="${shop.getId()}">1</td>
          <td><img th:src="@{/img/{image}(image=${shop.imageurl})}" alt="" style="width:100px;height:auto;border-radius:5px;object-fit:cover;"></td>
          <td th:text="${shop.shopname}"></td>
          <td th:text="${shop.account.name}"></td>
          <td th:text="${shop.phone}"></td>
          <td th:text="${shop.address}"></td>
          <td th:text="${shop.createdAt}"></td>
          <td th:text="${shop.updatedAt}"></td>
          <td>
            <button class="btn btn-edit">Xem</button>
            <button class="btn btn-delete">Xóa</button>
          </td>
        </tr>
        </tbody></table>
    </div>
    <!-- /.box-body -->
    <div class="box-footer clearfix">
      <ul class="pagination">
        <li><a href="#">«</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">»</a></li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
